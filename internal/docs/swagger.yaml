basePath: /api/v1
definitions:
  auth.loginRequest:
    properties:
      login:
        type: string
      password:
        type: string
    required:
    - login
    - password
    type: object
  auth.refreshRequest:
    properties:
      refresh_token:
        type: string
    required:
    - refresh_token
    type: object
  auth.registerRequest:
    properties:
      login:
        type: string
      password:
        type: string
      role:
        type: string
    required:
    - login
    - password
    type: object
  lots.lotsRequest:
    properties:
      description:
        type: string
      endsAt:
        type: string
      photo:
        type: string
      startPrice:
        type: number
      status:
        type: string
      title:
        type: string
    required:
    - description
    - endsAt
    - photo
    - startPrice
    - status
    - title
    type: object
  lots.updateLotRequest:
    properties:
      ID:
        type: integer
      description:
        type: string
      endsAt:
        type: string
      photo:
        type: string
      startPrice:
        type: number
      title:
        type: string
    required:
    - description
    - endsAt
    - photo
    - startPrice
    - title
    type: object
host: localhost:9999
info:
  contact: {}
  title: AuctionHouse API
  version: "1.0"
paths:
  /admin/close-expired:
    post:
      description: Ручной запуск закрытия лотов с истёкшим дедлайном
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: integer
            type: object
        "401":
          description: Unauthorized
        "403":
          description: Forbidden
      security:
      - BearerAuth: []
      summary: Закрыть просроченные лоты
      tags:
      - admin
  /auth/login:
    post:
      consumes:
      - application/json
      description: Проверяет логин и пароль, возвращает токен
      parameters:
      - description: Логин и пароль
        in: body
        name: input
        required: true
        schema:
          $ref: '#/definitions/auth.loginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
        "400":
          description: Bad Request
        "500":
          description: Internal Server Error
      summary: Авторизация пользователя
      tags:
      - auth
  /auth/logout:
    post:
      consumes:
      - application/json
      description: Отзывает refresh-токен
      parameters:
      - description: Refresh токен
        in: body
        name: input
        required: true
        schema:
          $ref: '#/definitions/auth.refreshRequest'
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
        "500":
          description: Internal Server Error
      security:
      - BearerAuth: []
      summary: Выход пользователя
      tags:
      - auth
  /auth/refresh:
    post:
      consumes:
      - application/json
      description: Ротирует refresh-токен и выдаёт новую пару токенов
      parameters:
      - description: Refresh токен
        in: body
        name: input
        required: true
        schema:
          $ref: '#/definitions/auth.refreshRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
        "400":
          description: Bad Request
        "401":
          description: Unauthorized
      summary: Обновление токенов
      tags:
      - auth
  /auth/register:
    post:
      consumes:
      - application/json
      description: Создаёт пользователя в базу
      parameters:
      - description: Регистрация
        in: body
        name: input
        required: true
        schema:
          $ref: '#/definitions/auth.registerRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
        "400":
          description: Bad Request
        "500":
          description: Internal Server Error
      summary: Регистрация пользователя
      tags:
      - auth
  /lots:
    get:
      description: Метод возрвщает список активных лотов
      parameters:
      - description: Добавить лот
        in: body
        name: input
        required: true
        schema:
          $ref: '#/definitions/lots.lotsRequest'
      - description: Добавить лот
        in: body
        name: input
        required: true
        schema:
          $ref: '#/definitions/lots.lotsRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
        "400":
          description: Bad Request
      summary: Получение список лотов
      tags:
      - lots
  /lots/:id:
    delete:
      description: Получает лот по ID и удаляет его
      produces:
      - application/json
      responses:
        "200":
          description: OK
        "401":
          description: Unauthorized
        "403":
          description: Forbidden
      summary: Удаление лот по ID
      tags:
      - lots
    put:
      description: Получает лот по ID и меняет его значение
      parameters:
      - description: Изменит лот
        in: body
        name: input
        required: true
        schema:
          $ref: '#/definitions/lots.updateLotRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
        "401":
          description: Unauthorized
        "403":
          description: Forbidden
      summary: Получение лот по ID
      tags:
      - lots
  /lots/new:
    post:
      description: Создает лоты в базу
      parameters:
      - description: Добавить лот
        in: body
        name: input
        required: true
        schema:
          $ref: '#/definitions/lots.lotsRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
        "401":
          description: Unauthorized
        "403":
          description: Forbidden
      summary: Создать лоты
      tags:
      - lots
  /me:
    get:
      description: Возвращает данные авторизованного пользователя.
      produces:
      - application/json
      responses:
        "200":
          description: OK
        "401":
          description: Unauthorized
        "404":
          description: Not Found
        "500":
          description: Internal Server Error
      security:
      - BearerAuth: []
      summary: Информация о текущем пользователе
      tags:
      - user
securityDefinitions:
  BearerAuth:
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
